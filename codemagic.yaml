
workflows:
  android-workflow:
    name: Build Android APK
    environment:
      flutter: stable
    scripts:
      - name: Create Android folder if missing
        script: flutter create . --platforms=android
      - name: Get packages
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
